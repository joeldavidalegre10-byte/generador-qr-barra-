<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Códigos QR y de Barras</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f3f4f6;color:#111}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:0;border-radius:8px;background:#e5e7eb;font-size:1rem;cursor:pointer}
.tabs button.on{background:#1d4ed8;color:#fff}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0002}
label{display:block;margin:10px 0 4px;font-size:.9rem;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=color]{padding:2px;height:42px}
.out{margin-top:16px;text-align:center;min-height:120px}
.out img,.out svg{max-width:100%;height:auto}
.btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btns button{padding:10px 16px;border:0;border-radius:8px;background:#16a34a;color:#fff;font-size:1rem;cursor:pointer}
.err{color:#b91c1c;margin-top:8px;font-size:.9rem}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Generador de Códigos QR y de Barras</h1>
<div class="tabs">
  <button id="tabQr" class="on">Código QR</button>
  <button id="tabBar">Código de barras</button>
</div>

<section id="qr" class="card">
  <label for="qrText">Texto o URL</label>
  <textarea id="qrText" rows="3" placeholder="https://mi-sitio.com">https://</textarea>
  <div class="row">
    <div><label for="qrSize">Tamaño (px)</label><input id="qrSize" type="number" value="300" min="100" max="1200" step="50"></div>
    <div><label for="qrEc">Corrección de errores</label>
      <select id="qrEc"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></div>
    <div><label for="qrFg">Color</label><input id="qrFg" type="color" value="#000000"></div>
    <div><label for="qrBg">Fondo</label><input id="qrBg" type="color" value="#ffffff"></div>
  </div>
  <div class="out" id="qrOut"></div>
  <div class="err" id="qrErr"></div>
  <div class="btns"><button id="qrPng">Descargar PNG</button><button id="qrSvg">Descargar SVG</button></div>
</section>

<section id="bar" class="card hide">
  <label for="bcText">Valor</label>
  <input id="bcText" value="123456789012">
  <div class="row">
    <div><label for="bcFmt">Formato</label>
      <select id="bcFmt">
        <option value="CODE128">CODE128 (cualquier texto)</option>
        <option value="EAN13">EAN-13 (12-13 dígitos)</option>
        <option value="EAN8">EAN-8 (7-8 dígitos)</option>
        <option value="UPC">UPC-A (11-12 dígitos)</option>
        <option value="CODE39">CODE39</option>
        <option value="ITF14">ITF-14 (13-14 dígitos)</option>
      </select></div>
    <div><label for="bcH">Alto (px)</label><input id="bcH" type="number" value="100" min="30" max="400"></div>
    <div><label for="bcW">Grosor de barra</label><input id="bcW" type="number" value="2" min="1" max="6"></div>
    <div><label for="bcTxt">Mostrar texto</label><select id="bcTxt"><option value="1">Sí</option><option value="0">No</option></select></div>
  </div>
  <div class="out"><svg id="bcSvg"></svg></div>
  <div class="err" id="bcErr"></div>
  <div class="btns"><button id="bcPng">Descargar PNG</button><button id="bcSvgDl">Descargar SVG</button></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
const $ = id => document.getElementById(id);
function download(href, name){const a=document.createElement('a');a.href=href;a.download=name;a.click();}
function svgToPng(svgEl, name, scale){
  const xml = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const c=document.createElement('canvas');
    c.width=img.width*scale; c.height=img.height*scale;
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    x.drawImage(img,0,0,c.width,c.height);
    download(c.toDataURL('image/png'), name);
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
}

/* Pestañas */
$('tabQr').onclick=()=>{$('qr').classList.remove('hide');$('bar').classList.add('hide');$('tabQr').classList.add('on');$('tabBar').classList.remove('on');};
$('tabBar').onclick=()=>{$('bar').classList.remove('hide');$('qr').classList.add('hide');$('tabBar').classList.add('on');$('tabQr').classList.remove('on');};

/* QR */
let qrSvgText='';
function makeQr(){
  $('qrErr').textContent='';
  const t=$('qrText').value;
  if(!t){$('qrOut').innerHTML='';return;}
  try{
    const q=qrcode(0,$('qrEc').value); q.addData(t); q.make();
    const size=+$('qrSize').value||300, n=q.getModuleCount(), cell=size/n;
    const fg=$('qrFg').value, bg=$('qrBg').value;
    let p='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++) if(q.isDark(r,c)) p+=`M${(c*cell).toFixed(2)} ${(r*cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`;
    qrSvgText=`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="${bg}"/><path d="${p}" fill="${fg}"/></svg>`;
    $('qrOut').innerHTML=qrSvgText;
  }catch(e){$('qrErr').textContent='No se pudo generar el QR (¿texto demasiado largo?).';}
}
['qrText','qrSize','qrEc','qrFg','qrBg'].forEach(i=>$(i).addEventListener('input',makeQr));
$('qrSvg').onclick=()=>{ if(qrSvgText) download('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qrSvgText),'qr.svg'); };
$('qrPng').onclick=()=>{ const s=$('qrOut').querySelector('svg'); if(s) svgToPng(s,'qr.png',2); };

/* Código de barras */
function makeBar(){
  $('bcErr').textContent='';
  try{
    JsBarcode('#bcSvg',$('bcText').value,{
      format:$('bcFmt').value, height:+$('bcH').value||100, width:+$('bcW').value||2,
      displayValue:$('bcTxt').value==='1', margin:10, background:'#ffffff',
      valid:ok=>{ if(!ok) $('bcErr').textContent='El valor no es válido para este formato.'; }
    });
  }catch(e){ $('bcErr').textContent='El valor no es válido para este formato.'; }
}
['bcText','bcFmt','bcH','bcW','bcTxt'].forEach(i=>$(i).addEventListener('input',makeBar));
$('bcSvgDl').onclick=()=>download('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString($('bcSvg'))),'codigo-barras.svg');
$('bcPng').onclick=()=>svgToPng($('bcSvg'),'codigo-barras.png',2);

makeQr(); makeBar();
</script>
</body>
</html>
